services:
  - type: web
    name: aether-landing
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT --workers 1
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.6"
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        value: entropy-vectors
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: LEMONSQUEEZY_API_KEY
        sync: false
      - key: LEMONSQUEEZY_STORE_ID
        sync: false
      - key: LEMONSQUEEZY_SIGNAL_VARIANT_ID
        sync: false
      - key: LEMONSQUEEZY_SIGNAL_PRO_VARIANT_ID
        sync: false
      - key: APP_URL
        sync: false
      - key: CORS_ORIGINS_RAW
        sync: false
      - key: ENVIRONMENT
        value: production
