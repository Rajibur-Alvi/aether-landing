<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entropy Analysis</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 20px; background-color: #f4f4f4; }
        .container { max-width: 800px; margin: 0 auto; }
        .button { background-color: #007bff; color: white; padding: 10px 20px; border: none; cursor: pointer; margin: 10px; border-radius: 5px; }
        .button:hover { background-color: #0056b3; }
        .modal { display: none; position: fixed; z-index: 1; left: 0; top: 0; width: 100%; height: 100%; overflow: auto; background-color: rgba(0,0,0,0.4); }
        .modal-content { background-color: #fefefe; margin: 15% auto; padding: 20px; border: 1px solid #888; width: 80%; max-width: 500px; border-radius: 10px; }
        .close { color: #aaa; float: right; font-size: 28px; font-weight: bold; }
        .close:hover { color: black; cursor: pointer; }
        .tab { overflow: hidden; border: 1px solid #ccc; background-color: #f1f1f1; }
        .tab button { background-color: inherit; float: left; border: none; outline: none; cursor: pointer; padding: 14px 16px; transition: 0.3s; }
        .tab button:hover { background-color: #ddd; }
        .tab button.active { background-color: #ccc; }
        .tabcontent { display: none; padding: 6px 12px; border: 1px solid #ccc; border-top: none; }
        textarea { width: 100%; height: 200px; }
        .loading { display: none; color: blue; }
        .error { color: red; }
        .subscription { display: none; color: orange; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Entropy Analysis Tool</h1>
        <p>Test our entropy analysis with free trials.</p>
        <button class="button" onclick="openModal('Start Free')">Start Free</button>
        <button class="button" onclick="openModal('Start 14-Day Trial')">Start 14-Day Trial</button>
        <button class="button" onclick="openModal('Request Demo')">Request Demo</button>

        <div id="myModal" class="modal">
            <div class="modal-content">
                <span class="close" onclick="closeModal()">&times;</span>
                <h2>Entropy Analysis</h2>
                <div class="tab">
                    <button class="tablinks" onclick="openTab(event, 'File')">Upload File</button>
                    <button class="tablinks" onclick="openTab(event, 'Text')">Paste Text</button>
                </div>
                <div id="File" class="tabcontent">
                    <form id="fileForm">
                        <input type="file" id="fileInput" accept=".txt,.pdf" required>
                        <br><br>
                        <button type="submit" class="button">Analyze</button>
                    </form>
                </div>
                <div id="Text" class="tabcontent">
                    <form id="textForm">
                        <textarea id="textInput" placeholder="Paste your text here..." required></textarea>
                        <br><br>
                        <button type="submit" class="button">Analyze</button>
                    </form>
                </div>
                <div class="loading" id="loading">Analyzing... Please wait.</div>
                <div class="error" id="error"></div>
                <div class="subscription" id="subscription">
                    Free trials exhausted. Please subscribe to continue.
                    <br><br>
                    <button class="button" onclick="subscribe('signal_pro')">Subscribe to Signal Pro ($99/month)</button>
                    <button class="button" onclick="subscribe('aether_core')">Subscribe to Aether Core (Custom)</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://js.stripe.com/v3/"></script>
    <script>
        const API_BASE = 'https://aether-landing.onrender.com/api';
        const STRIPE_PUBLISHABLE_KEY = 'pk_test_placeholder'; // Replace with actual key
        let freeUses = parseInt(localStorage.getItem('freeUses')) || 0;

        function openModal(buttonType) {
            if (freeUses >= 2) {
                document.getElementById('subscription').style.display = 'block';
                return;
            }
            document.getElementById('myModal').style.display = 'block';
            openTab(null, 'File'); // Default to file tab
        }

        function closeModal() {
            document.getElementById('myModal').style.display = 'none';
            document.getElementById('error').textContent = '';
            document.getElementById('subscription').style.display = 'none';
        }

        function openTab(evt, tabName) {
            var i, tabcontent, tablinks;
            tabcontent = document.getElementsByClassName("tabcontent");
            for (i = 0; i < tabcontent.length; i++) {
                tabcontent[i].style.display = "none";
            }
            tablinks = document.getElementsByClassName("tablinks");
            for (i = 0; i < tablinks.length; i++) {
                tablinks[i].className = tablinks[i].className.replace(" active", "");
            }
            document.getElementById(tabName).style.display = "block";
            if (evt) evt.currentTarget.className += " active";
        }

        document.getElementById('fileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (freeUses >= 2) return;
            const file = document.getElementById('fileInput').files[0];
            if (!file) return;
            await analyze('file', file);
        });

        document.getElementById('textForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            if (freeUses >= 2) return;
            const text = document.getElementById('textInput').value;
            if (!text.trim()) return;
            await analyze('text', text);
        });

        async function analyze(type, data) {
            document.getElementById('loading').style.display = 'block';
            document.getElementById('error').textContent = '';
            try {
                let response;
                if (type === 'file') {
                    const formData = new FormData();
                    formData.append('file', data);
                    formData.append('title', data.name);
                    response = await fetch(`${API_BASE}/ingest/file`, {
                        method: 'POST',
                        body: formData
                    });
                } else {
                    response = await fetch(`${API_BASE}/ingest/text`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ content: data, title: 'Pasted Text' })
                    });
                }
                if (!response.ok) throw new Error('Ingest failed');
                const result = await response.json();
                const documentId = result.document_id;

                // Now ask for entropy analysis
                const chatResponse = await fetch(`${API_BASE}/chat/ask`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: 'Analyze the entropy of this document.', document_id: documentId })
                });
                if (!chatResponse.ok) throw new Error('Analysis failed');
                const chatResult = await chatResponse.json();
                alert(`Analysis complete. Entropy Score: ${chatResult.meta.entropy_score}`);
                freeUses++;
                localStorage.setItem('freeUses', freeUses);
                closeModal();
            } catch (err) {
                document.getElementById('error').textContent = err.message;
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        async function subscribe(product) {
            try {
                const response = await fetch(`${API_BASE}/create-checkout-session`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product })
                });
                if (!response.ok) throw new Error('Failed to create checkout session');
                const result = await response.json();
                window.location.href = result.checkout_url;
            } catch (err) {
                alert('Subscription error: ' + err.message);
            }
        }
    </script>
</body>
</html>
